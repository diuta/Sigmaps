<!doctype html>
<html lang="en">
  <head>
    <title>Display a map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@6.0.0/dist/maplibre-gl.css"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
      }
      html,
      body,
      #map {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script type="module">
      import * as maplibregl from "https://unpkg.com/maplibre-gl@6.0.0/dist/maplibre-gl.mjs";

      const map = new maplibregl.Map({
        container: "map",
        style:
          "https://v2.basemap.mapid.io/styles/street-v2.0/style.json?key=6a7f1380610fe054a12df035",
        center: [106.8271129, -6.1754398],
        zoom: 15.5,
        pitch: 60,
        bearing: 0,
      });
    </script>
  </body>
</html>
